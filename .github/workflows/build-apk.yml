name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Prepare app icon from provided artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/src/main/res/icon-source.base64 > app/src/main/res/drawable-nodpi/ic_launcher.jpg

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify APK package and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aev0rnJP-SPEED-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TAG="v1.0.0"
          ASSET="app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#$ASSET" --clobber
            gh release edit "$TAG" --title "Aev0rnJP SPEED Android APK" --notes "Aev0rnJP SPEED のAndroid用APKです。\n\nAndroid端末向けのインストールファイルです。iPhoneではインストールできません。測定には通信量が発生します。"
          else
            gh release create "$TAG" "$APK#$ASSET" --title "Aev0rnJP SPEED Android APK" --notes "Aev0rnJP SPEED のAndroid用APKです。\n\nAndroid端末向けのインストールファイルです。iPhoneではインストールできません。測定には通信量が発生します。"
          fi
